# Festeryga Law, Option B staging.
# Publishes branch design-refinement-oct23 of MozwellStudios/festeryga-site to
# https://mozwellstudios.github.io/festeryga-option-b/ . Version A (festeryga-site main) is never touched.
name: Deploy Option B staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of festeryga-site to publish"
        default: design-refinement-oct23
        required: true
  push:
    branches: [main]   # edits to this workflow redeploy the current branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Option B source (read-only, public repo)
        uses: actions/checkout@v4
        with:
          repository: MozwellStudios/festeryga-site
          ref: ${{ inputs.ref || 'design-refinement-oct23' }}
          path: site

      - name: Prepare staging output
        run: |
          set -e
          cd site
          echo "Publishing $(git rev-parse HEAD)"
          rm -rf .git .github
          find . -type d -name option-b -prune -exec rm -rf {} +
          printf '# Festeryga Law, Option B staging (review only, not for indexing)\nUser-agent: *\nDisallow: /\n' > robots.txt
          missing=$(grep -L 'name="robots" content="noindex' $(find . -name '*.html') || true)
          if [ -n "$missing" ]; then echo "Pages without noindex:"; echo "$missing"; exit 1; fi
          touch .nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
